<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="Una pausa de cinco minutos para respirar con calma.">
  <title>Pulso · Respiración 4–2–6</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23090d16'/%3E%3Ccircle cx='32' cy='32' r='17' fill='%237ce8cf' fill-opacity='.18' stroke='%237ce8cf' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%237ce8cf'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#090d16;--panel:#101722;--ink:#f2f6f8;--muted:#86949f;--mint:#7ce8cf;--blue:#779cff;--phase:0;--breath-scale:.52}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100svh;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:-35%;background:radial-gradient(circle at 50% 42%,rgba(52,105,115,.20),transparent 31%),radial-gradient(circle at 25% 85%,rgba(59,71,129,.12),transparent 23%);pointer-events:none}
    main{position:relative;z-index:1;min-height:100svh;max-width:540px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 22px max(26px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;gap:20px}
    header{display:flex;justify-content:space-between;align-items:center}
    .brand{font-size:.76rem;font-weight:750;letter-spacing:.25em;text-transform:uppercase;color:#b9c4ca}
    .timer{font-variant-numeric:tabular-nums;font-size:1.1rem;font-weight:650;letter-spacing:.08em}
    .timer span{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.16em;margin-right:8px}
    .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:490px;text-align:center}
    .orb-wrap{width:min(74vw,350px);aspect-ratio:1;display:grid;place-items:center;position:relative}
    .orbit{position:absolute;inset:6%;border:1px solid rgba(124,232,207,.14);border-radius:50%;transform:rotate(-18deg)}
    .orbit::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--mint);top:13%;left:17%;box-shadow:0 0 18px var(--mint)}
    .orb{width:100%;height:100%;border-radius:50%;transform:scale(var(--breath-scale));background:radial-gradient(circle at 38% 34%,rgba(226,255,249,.95) 0 2%,rgba(124,232,207,.88) 10%,rgba(83,158,172,.48) 43%,rgba(39,68,103,.20) 64%,transparent 71%);filter:drop-shadow(0 0 28px rgba(124,232,207,.20));will-change:transform}
    .ring{position:absolute;inset:17%;border-radius:50%;border:1px solid rgba(124,232,207,.34);transform:scale(var(--breath-scale));opacity:.8;will-change:transform}
    .copy{margin-top:7px;height:90px}
    h1{margin:0;font-size:clamp(2rem,8vw,3.15rem);font-weight:500;letter-spacing:-.045em}
    .cue{margin:10px 0 0;color:var(--muted);font-size:1rem;letter-spacing:.02em}
    .cue strong{color:var(--mint);font-weight:650;font-variant-numeric:tabular-nums}
    .controls{border-top:1px solid rgba(255,255,255,.08);padding-top:18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
    button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .primary{min-height:56px;border-radius:18px;background:var(--ink);color:#0b1118;font-size:1rem;font-weight:750;letter-spacing:.01em;transition:transform .15s ease,background .2s ease}
    .primary:active{transform:scale(.985)}
    .primary:hover{background:#dff8f1}
    .sound{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center}
    .sound svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .sound[aria-pressed="false"]{color:#67737c}
    .status{grid-column:1/-1;margin:1px 4px 0;color:#687782;font-size:.78rem;min-height:18px}
    .finished .orb{animation:complete 1.8s ease-in-out infinite alternate}
    @keyframes complete{to{transform:scale(.67);filter:drop-shadow(0 0 42px rgba(124,232,207,.42))}}
    @media (max-height:680px){main{padding-top:18px;padding-bottom:18px}.stage{min-height:410px}.orb-wrap{width:min(60vh,300px)}.copy{height:78px}h1{font-size:2.2rem}}
    @media (prefers-reduced-motion:reduce){.orb,.ring,.primary{transition:none!important}.finished .orb{animation:none}}
  </style>
</head>
<body>
  <main id="app">
    <header>
      <div class="brand">Pulso</div>
      <div class="timer"><span>restan</span><b id="timer">05:00</b></div>
    </header>

    <section class="stage" aria-live="polite">
      <div class="orb-wrap" aria-hidden="true">
        <div class="orbit"></div><div class="ring"></div><div class="orb"></div>
      </div>
      <div class="copy">
        <h1 id="phase">Tu pausa</h1>
        <p class="cue" id="cue">Cinco minutos. Solo seguí el pulso.</p>
      </div>
    </section>

    <div class="controls">
      <button class="primary" id="toggle" type="button">Empezar</button>
      <button class="sound" id="feedback" type="button" aria-pressed="true" aria-label="Desactivar señales">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.8 8.5H4v7h2.8L11 19V5Z"/><path d="M15 9.2a4 4 0 0 1 0 5.6M17.8 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      </button>
      <div class="status" id="status">Señales suaves activas.</div>
    </div>
  </main>

  <script>
    (() => {
      const SESSION = 300000, phases = [
        {name:'Inhalá', ms:4000, from:.52, to:1, hint:'llená suave', buzz:[35]},
        {name:'Sostené', ms:2000, from:1, to:1, hint:'sin tensión', buzz:[28,45,28]},
        {name:'Exhalá', ms:6000, from:1, to:.52, hint:'soltá despacio', buzz:[80]}
      ];
      const app=document.querySelector('#app'), timer=document.querySelector('#timer'), phaseEl=document.querySelector('#phase'), cue=document.querySelector('#cue'), toggle=document.querySelector('#toggle'), feedbackButton=document.querySelector('#feedback'), status=document.querySelector('#status');
      const canVibrate='vibrate' in navigator;
      let running=false, finished=false, feedback=true, startedAt=0, pausedElapsed=0, raf=0, lastPhase=-1, audioCtx=null;
      const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
      const ensureAudio=()=>{if(!audioCtx){const AudioContext=window.AudioContext||window.webkitAudioContext;if(AudioContext)audioCtx=new AudioContext()}if(audioCtx?.state==='suspended')audioCtx.resume()};
      const tone=(frequency,duration=.32)=>{if(!feedback)return;ensureAudio();if(!audioCtx)return;const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(frequency,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.045,now+.035);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.03)};
      const signal=(pattern,frequency)=>{if(!feedback)return;if(canVibrate)navigator.vibrate(pattern);tone(frequency)};
      const feedbackText=()=>feedback?(canVibrate?'Sonido y vibración activos.':'Sonido activo · iPhone no admite vibración web.'):'Señales desactivadas.';
      function setPhase(index, phaseTime){
        const p=phases[index], progress=Math.min(1,phaseTime/p.ms), eased=.5-Math.cos(progress*Math.PI)/2, scale=p.from+(p.to-p.from)*eased;
        document.documentElement.style.setProperty('--breath-scale',scale.toFixed(4));
        phaseEl.textContent=p.name;
        cue.innerHTML=`<strong>${Math.max(1,Math.ceil((p.ms-phaseTime)/1000))}</strong> · ${p.hint}`;
        if(index!==lastPhase){lastPhase=index;signal(p.buzz,[392,523,330][index])}
      }
      function draw(now){
        if(!running)return;
        const elapsed=pausedElapsed+(now-startedAt), remaining=SESSION-elapsed;
        timer.textContent=fmt(remaining);
        if(remaining<=0){complete();return}
        const cycle=elapsed%12000;
        let offset=0,index=0;
        for(let i=0;i<phases.length;i++){if(cycle<offset+phases[i].ms){index=i;break}offset+=phases[i].ms}
        setPhase(index,cycle-offset);raf=requestAnimationFrame(draw)
      }
      function start(){
        if(finished){finished=false;pausedElapsed=0;timer.textContent='05:00';app.classList.remove('finished')}
        ensureAudio();running=true;startedAt=performance.now();toggle.textContent='Pausar';status.textContent=feedbackText();if(feedback&&canVibrate)navigator.vibrate(40);raf=requestAnimationFrame(draw)
      }
      function pause(){
        pausedElapsed+=performance.now()-startedAt;running=false;cancelAnimationFrame(raf);toggle.textContent='Continuar';phaseEl.textContent='En pausa';cue.textContent='Cuando quieras, seguimos.';if(feedback&&canVibrate)navigator.vibrate(20)
      }
      function complete(){
        running=false;finished=true;pausedElapsed=0;cancelAnimationFrame(raf);timer.textContent='00:00';phaseEl.textContent='Listo';cue.textContent='Volvé a tu día un poco más liviano.';toggle.textContent='Otra pausa';app.classList.add('finished');signal([90,70,90,70,180],587);setTimeout(()=>tone(784,.5),190)
      }
      toggle.addEventListener('click',()=>running?pause():start());
      feedbackButton.addEventListener('click',()=>{feedback=!feedback;feedbackButton.setAttribute('aria-pressed',String(feedback));feedbackButton.setAttribute('aria-label',feedback?'Desactivar señales':'Activar señales');status.textContent=feedbackText();if(feedback){ensureAudio();signal(35,440)}});
      document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)pause()});
      status.textContent=feedbackText();
      const ctx=document.modelContext;
      if(ctx?.registerTool){
        const schema={type:'object',properties:{},additionalProperties:false};
        const valid=input=>{if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw new TypeError('Este control no acepta parámetros.')};
        Promise.resolve(ctx.registerTool({name:'start_breathing_session',title:'Empezar respiración',description:'Inicia o continúa la sesión visible de respiración de cinco minutos.',inputSchema:schema,annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){valid(input);if(!running)start();return {running:true,remaining:timer.textContent}}})).catch(()=>{});
        Promise.resolve(ctx.registerTool({name:'pause_breathing_session',title:'Pausar respiración',description:'Pausa la sesión visible de respiración.',inputSchema:schema,annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){valid(input);if(running)pause();return {running:false,remaining:timer.textContent}}})).catch(()=>{});
      }
    })();
  </script>
</body>
</html>
